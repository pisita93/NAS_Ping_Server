version: "3.8"

# Deploy via Portainer:
#   Stacks → Add stack → Build method: Repository
#   Repository URL:  https://github.com/pisita93/NAS_Ping_Server
#   Compose path:    docker-compose.yml
#   Set the env vars below in Portainer's "Environment variables" panel.
#
# The image is auto-built and published by GitHub Actions to:
#   ghcr.io/pisita93/nas-ping-server:latest
# Make the GHCR package public once after the first build (one-time step).

services:
  nas-ping-server:
    container_name: nas-ping-server
    image: ghcr.io/pisita93/nas-ping-server:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-5500}:5500"
    volumes:
      # DATA_PATH defaults to a Docker-managed named volume (works everywhere).
      # On Synology, set DATA_PATH=/volume1/docker/nas-ping-server/data for
      # easy file-station backups.
      - ${DATA_PATH:-nas-ping-data}:/data
    environment:
      TZ: ${TZ:-Asia/Bangkok}
      PORT: 5500
      DATA_DIR: /data
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD on first boot}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      NOTIFY_FROM: ${NOTIFY_FROM:-}
      NOTIFY_TO: ${NOTIFY_TO:-}
      NOTIFY_FAILURE_THRESHOLD: ${NOTIFY_FAILURE_THRESHOLD:-2}
      EXECUTION_RETENTION: ${EXECUTION_RETENTION:-1000}
      PUBLIC_URL: ${PUBLIC_URL:-}

volumes:
  nas-ping-data:
